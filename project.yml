name: SkiPlay
options:
  bundleIdPrefix: com.skistudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
targets:
  SkiPlay:
    type: application
    platform: iOS
    sources:
      - path: SkiPlay
      - path: Bridge
    info:
      path: SkiPlay/Info.plist
      properties:
        CFBundleDisplayName: Ski Play
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSLocalNetworkUsageDescription: Ski Play looks for your PlayStation on your Wi-Fi and streams games from it.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIStatusBarHidden: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skistudio.play
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/SkiPlay-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/include", "$(SRCROOT)/Bridge"]
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/Vendor/lib"]
        OTHER_LDFLAGS: ["-lchiakiall", "-lz", "-lresolv"]
        GCC_C_LANGUAGE_STANDARD: gnu11
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: VideoToolbox.framework
      - sdk: GameController.framework
      - sdk: CoreHaptics.framework
    scheme: {}
